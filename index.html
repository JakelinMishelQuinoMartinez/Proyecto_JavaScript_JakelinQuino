<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚘 CampusParking</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- ENCABEZADO -->
    <header class="header">
        <div id="logo_name">
            <img class="logo" src="img/LogoAuto.png" alt="Logo">
            <span class="text_hide">CampusParking</span>
        </div>

        <div id="perfil">
            <span>Welcome <span class="text_hide">Admin</span></span>
            <img class="img-svg" src="img/person-circle.svg" alt="User_icon">
        </div>

        <div id="log_out">
            <span class="text_hide">Log out</span>
            <img class="img-svg" src="img/box-arrow-right.svg" alt="Logout">
        </div>
    </header>

    <!-- MAIN -->
    <main class="main">

        <!-- OPCIONES -->
        <div id="servicescontainer">
            <img class="img-svg" src="img/patch-plus.svg" alt="Más"> 
            <span class="opc text_hide"> Servicios de Parqueo</span>
        </div>
        <div id="types_container">
            <img class="img-svg" src="img/car-front.svg" alt="Carro"> 
            <span class="opc text_hide"> Tipos de Vehiculos </span>
        </div>
        <div id="status_container">
            <img class="img-svg" src="img/coin.svg" alt="Moneda"> 
            <span class="opc text_hide"> Estados</span>
        </div>

        <!-- INICIAR SESIÓN -->
        <div id="log_in" class="seccion">
            <div class="card-content">
                <img class="logo" src="img/LogoAuto.png" alt="Logo">
                <h2 class="titulo_login">Campus Parking</h2>
                <p class="parrafo_login">Inicia sesión en tu cuenta</p>  
                <form id="loginForm">
                    <label class="formLabel">Email</label>
                    <input id="email" type="email" placeholder="ejemplo@gmail.com" required>
                    <label class="formLabel">Contraseña</label>
                    <input id="password" type="password" placeholder="Ingresa tu contraseña" required>
                    <button class="btn-signin" type="submit">Sign In</button>
                </form>
            </div>
        </div>

    </main>

    <script src="main.js"></script>
</body>
</html>
